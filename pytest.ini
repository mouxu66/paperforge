[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 让 mock_api 子包在任意 cwd 都可被 import（pytest 7.0+）。
# 老版本 pytest 与 IDE 直跑测试文件请看 conftest.py 兑底。
pythonpath = .
# 🧪 ADR-005 测试质量门禁：CI 强制覆盖率（.github/workflows/ci.yml 已显式 --cov=mock_api --cov-fail-under=70）。
# 本地默认【不】开启覆盖率：Windows 沙箱 safe-delete 会拦截删 .coverage，导致 pytest 启动即崩；
#   故把 --cov 移出 addopts，本地直接 `pytest` 即可跑。需本地看覆盖率时手动 `pytest --cov=mock_api`。
addopts =

# 🏷️ 测试标记（CI 按标记分组运行，critical 失败即红灯）
markers =
    critical: 核心安全/一致性用例（CI 红灯门禁）
    contract: HTTP 端点契约测试（422/404/403 等）
    integration: 集成测试（DB 迁移/跨模块流程）
    e2e: 端到端测试（SSE/完整审稿流程）
    slow: 耗时用例（CI 可单独跑或跳过）
    smoke: 烟雾测试（重构回归护栏）
    llm: 依赖真实 LLM 服务的用例（需 PAPERFORGE_LLM_AVAILABLE=1）

# 覆盖率排除：测试文件本身 + __init__ + 迁移脚本不纳入计算
[coverage:run]
omit =
    */tests/*
    */__init__.py
    */scripts/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    raise NotImplementedError
