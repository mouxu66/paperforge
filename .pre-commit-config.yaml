# PaperForge 提交前质量门禁
# 安装：pip install pre-commit && pre-commit install
# 手动全量：pre-commit run --all-files
# 作用：把代码质量把控前移到"提交瞬间"，低级错误自动拦截。

repos:
  # 基础文件卫生
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: debug-statements  # 拦截 pdb/ipdb 等遗留调试语句

  # 自定义：禁止在 mock_api/main.py 中内联定义 worker 函数
  - repo: local
    hooks:
      - id: no-inline-workers
        name: No inline worker definitions in main.py
        entry: python scripts/diagnostics/check_no_inline_workers.py mock_api/main.py
        language: system
        pass_filenames: false
        always_run: true

      # 自定义：AGENTS.md §2 纪律与 deepseek-harness skill 双向引用/锚点同步
      - id: agents-docs-sync
        name: AGENTS.md ↔ skill 纪律同步检查
        entry: python scripts/diagnostics/check_agents_docs_sync.py
        language: system
        pass_filenames: false
        always_run: true

      # 自定义：docs/adr/README.md 索引表与 ADR 文件一致性
      # files: 仅在本次提交触碰 docs/adr/ 时触发，避免存量未提交 ADR 阻塞无关提交
      - id: adr-index-sync
        name: ADR 索引一致性检查
        entry: python scripts/diagnostics/check_adr_index_sync.py
        language: system
        pass_filenames: false
        files: ^docs/adr/

  # ruff：lint + format 一体化（替代 flake8+black+isort）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^mock_api/
      - id: ruff-format
        files: ^mock_api/

  # 浏览器扩展测试：防止 content script / background / popup 回归
  - repo: local
    hooks:
      - id: extension-tests
        name: Extension unit tests
        # 仅在 node_modules 缺失时执行 npm install，避免每次提交都重新安装
        entry: bash -c 'cd extension && ([ -d node_modules ] || npm install) && npm test'
        language: system
        pass_filenames: false
        always_run: false
        files: "^extension/(package\\.json|package-lock\\.json|.*\\.(js|html|json|png))$"

  # mypy：类型检查（仅后端，渐进式）
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^mock_api/
        stages: [manual]  # 存量 335 个类型错误，阶段 3 再打开自动门禁
        additional_dependencies: [types-requests, types-sqlalchemy]
