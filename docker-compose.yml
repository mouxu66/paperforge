# PaperForge Docker Compose
# 一键启动本地推理服务（文本 Qwen + 视觉 Qwen3-VL）
#
# 用法：
#   1. 将模型文件放入 ./models/ 目录
#   2. 运行 docker compose up -d
#   3. 启动 PaperForge：python -m mock_api.main
#
# 前置条件：
#   - Docker Desktop 或 Docker Engine
#   - NVIDIA Container Toolkit（GPU 支持）
#   - 模型文件（见下方 volumes 配置）

services:
  # 文本推理服务（Qwen3.5-9B）
  llama-text:
    image: ghcr.io/ggerganov/llama.cpp:full
    command: >
      -m /models/Qwen3.5-9B-Q3_K_M.gguf
      --host 0.0.0.0
      --port 8080
      -ngl 35
      -c 8192
      --parallel 2
      --jinja
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 视觉推理服务（Qwen3-VL-4B）
  llama-vision:
    image: ghcr.io/ggerganov/llama.cpp:full
    command: >
      -m /models/Qwen3-VL-4B-Instruct-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwen3-VL-4B-Instruct-Q8_0.gguf
      --host 0.0.0.0
      --port 8082
      -ngl 35
      -c 4096
      --jinja
    volumes:
      - ./models:/models
    ports:
      - "8082:8082"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PaperForge 后端
  paperforge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8770:8770"
    volumes:
      - ./mock_api/paperforge_mock.db:/app/mock_api/paperforge_mock.db
      - ./uploads:/app/uploads
    environment:
      - PAPERFORGE_LLAMA_SERVER_HOST=llama-text
      - PAPERFORGE_LLAMA_SERVER_PORT=8080
      - PAPERFORGE_VISION_HTTP_URL=http://llama-vision:8082
      - PAPERFORGE_DEPTH_FIGURE_EVIDENCE_ENABLED=True
      - PAPERFORGE_DEPTH_FIGURE_WEIGHT=0.1
    depends_on:
      llama-text:
        condition: service_healthy
      llama-vision:
        condition: service_healthy
    restart: unless-stopped
