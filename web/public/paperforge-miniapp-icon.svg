  </g>

  <!-- The only visible project information: a quiet wordmark, no tagline or clutter. -->
  <text x="512" y="914" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="5" fill="#F4F0E8">PaperForge</text>
